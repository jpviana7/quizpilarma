<!doctype html>
<html lang="pt-BR">
<head>

<title>Escala de Obreiros ADVEC</title>

<style>
/* Layout: app de uma coluna (máx. 480px) com abas fixas embaixo; fundo azul profundo do brasão, dourado como luz e destaque. Tema único e escuro, por escolha. */
:root {
  --bg: #061430;
  --bg-2: #0a1f4a;
  --surface: #0e2658;
  --surface-2: #133070;
  --card: rgba(14, 38, 88, .78);
  --line: rgba(217, 178, 95, 0.2);
  --line-soft: rgba(159, 176, 208, 0.14);
  --ink: #eef2fb;
  --muted: #9fb0d0;
  --dim: #6f82a8;
  --gold: #d9b25f;
  --gold-hi: #f7e2a6;
  --gold-lo: #9f7428;
  --on-gold: #241703;
  --ok: #7be0b0;
  --warn: #ffb27a;
  --grad-gold: linear-gradient(135deg, #f7e2a6 0%, #d9b25f 45%, #a67c2e 100%);
  --font-display: "Sora", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg: 22px;
  --r-md: 16px;
  --tabbar-h: 66px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.ambient i {
  position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(60px); opacity: .22;
  background: radial-gradient(circle, rgba(217,178,95,.55), transparent 62%);
  animation: drift 18s ease-in-out infinite alternate;
}
.ambient i:nth-child(1) { top: -35vmax; right: -30vmax; }
.ambient i:nth-child(2) { bottom: -40vmax; left: -35vmax; opacity: .14; animation-duration: 24s; background: radial-gradient(circle, rgba(90,140,255,.6), transparent 62%); }
@keyframes drift { to { transform: translate(-6vmax, 5vmax) scale(1.08); } }

.app {
  position: relative; z-index: 1; max-width: 480px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 190px;
}
.app.no-tabs { padding-block-end: 40px; }
.screen { display: flex; flex-direction: column; gap: 18px; animation: screenIn .5s var(--ease) both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(12px); } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes pop { 40% { transform: scale(1.22); } }

/* ---------- Boas-vindas / escolha do nome ---------- */
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding-top: 34px; }
.seal { position: relative; width: 128px; height: 128px; display: grid; place-items: center; }
.seal::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; background: conic-gradient(from 0deg, #a67c2e, #f7e2a6, #d9b25f, #6f4f17, #f7e2a6, #a67c2e); animation: spin 9s linear infinite; }
.seal::after { content: ""; position: absolute; inset: -26px; border-radius: 50%; background: radial-gradient(circle, rgba(217,178,95,.38), transparent 66%); animation: glow 3.2s ease-in-out infinite; z-index: -1; }
.seal img { position: relative; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--bg); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes glow { 50% { transform: scale(1.08); opacity: .6; } }
.eyebrow { font-family: var(--font-display); font-weight: 600; letter-spacing: .32em; text-transform: uppercase; font-size: 12px; color: var(--gold); }
h1 {
  margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 9vw, 38px); line-height: 1.08; text-wrap: balance; letter-spacing: -.02em;
  background: linear-gradient(100deg, var(--gold-hi) 0%, var(--gold) 30%, #fff6d8 50%, var(--gold) 70%, var(--gold-hi) 100%);
  background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: sheen 6s ease-in-out infinite;
}
@keyframes sheen { 0%, 100% { background-position: 0% 0; } 50% { background-position: 100% 0; } }
.lead { margin: 0; color: var(--muted); max-width: 34ch; text-wrap: balance; }
.lead b { color: var(--ink); font-weight: 600; }
.section-label { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0; }
.names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.name {
  display: flex; align-items: center; gap: 10px; min-width: 0; padding: 12px; border-radius: var(--r-md);
  background: var(--card); border: 1px solid var(--line-soft); color: var(--ink); font: inherit; font-weight: 500; text-align: left; cursor: pointer;
  transition: transform .2s var(--ease), border-color .2s, background .2s;
  animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 30ms + 120ms);
}
.name:active { transform: scale(.97); }
.av {
  flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 13px;
  background: var(--surface-2); color: var(--gold-hi); border: 1px solid var(--line);
}
.name .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.name .nm small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
.name[aria-pressed="true"] { background: rgba(217,178,95,.14); border-color: var(--gold); }
.name[aria-pressed="true"] .av { background: var(--grad-gold); color: var(--on-gold); border-color: transparent; }
.add-card { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: var(--r-lg); border: 1px dashed var(--line); background: rgba(14,38,88,.45); }
.add-row { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; }

.input, select.input, textarea.input {
  width: 100%; min-width: 0; padding: 13px 14px; border-radius: var(--r-md);
  background: rgba(6, 20, 48, .7); border: 1px solid var(--line-soft); color: var(--ink);
  font: inherit; outline: none; transition: border-color .2s, box-shadow .2s; resize: vertical;
}
.input::placeholder { color: var(--dim); }
.input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(217,178,95,.15); }
label.small { font-size: 13px; color: var(--muted); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 54px; padding: 0 22px; border-radius: 999px; border: 0; cursor: pointer;
  font: 700 16px/1 var(--font-display); letter-spacing: .01em; text-decoration: none;
  transition: transform .2s var(--ease), opacity .2s, box-shadow .3s, background .3s, color .3s;
}
.btn:active { transform: scale(.97); }
.btn-gold { background: var(--grad-gold); color: var(--on-gold); box-shadow: 0 10px 30px -8px rgba(217,178,95,.55), inset 0 1px 0 rgba(255,255,255,.5); position: relative; overflow: hidden; }
.btn-gold::after { content: ""; position: absolute; inset: 0; transform: translateX(-120%); background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); animation: shine 3.4s ease-in-out infinite 1.2s; }
@keyframes shine { 0% { transform: translateX(-120%); } 40%, 100% { transform: translateX(120%); } }
.btn-gold[disabled] { opacity: .35; box-shadow: none; cursor: not-allowed; }
.btn-gold[disabled]::after, .btn-gold.saved::after { display: none; }
.btn-gold.saved { background: rgba(123,224,176,.12); color: var(--ok); box-shadow: inset 0 0 0 1px rgba(123,224,176,.4); }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line-soft); }
.btn-sm { min-height: 40px; padding: 0 16px; font-size: 14px; }
.btn-block { width: 100%; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn-sm svg { width: 16px; height: 16px; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }

/* ---------- Topo ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
  background: rgba(6, 20, 48, .96); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 12px;
}
.topbar img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; flex: none; }
.who { min-width: 0; flex: 1; }
.who .hi { font-size: 12px; color: var(--muted); }
.who .nm { font-family: var(--font-display); font-weight: 700; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 4px 4px 12px; border-radius: 999px; background: rgba(159,176,208,.08); border: 1px solid var(--line-soft); color: var(--ink); font: 600 13px var(--font-body); cursor: pointer; max-width: 46%; }
.me-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-chip .av { width: 28px; height: 28px; font-size: 11px; }

/* ---------- Cartão do mês ---------- */
.summary {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; padding: 18px; border-radius: var(--r-lg);
  background: linear-gradient(160deg, rgba(19,48,112,.95), rgba(10,31,74,.95)); border: 1px solid var(--line);
  box-shadow: 0 20px 40px -24px rgba(0,0,0,.8);
}
.summary.wide { grid-template-columns: minmax(0, 1fr); }
.ring { position: relative; width: 84px; height: 84px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: rgba(159,176,208,.16); stroke-width: 8; }
.ring .bar { fill: none; stroke: url(#goldGrad); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .7s var(--ease); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-variant-numeric: tabular-nums; }
.ring .val b { display: block; font: 800 24px/1 var(--font-display); color: var(--gold-hi); }
.ring .val span { font-size: 11px; color: var(--muted); }
.month { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month h2 { margin: 0; font: 700 21px/1.2 var(--font-display); white-space: nowrap; }
.month { flex-wrap: wrap; }
.month h2 span { color: var(--gold); }
.arrows { display: flex; gap: 6px; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(159,176,208,.08); border: 1px solid var(--line-soft); color: var(--ink); cursor: pointer; flex: none; }
.icon-btn[disabled] { opacity: .3; cursor: default; }
.icon-btn svg { width: 16px; height: 16px; }
.summary p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.stats { display: flex; gap: 10px; margin-top: 12px; }
.stat { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 14px; background: rgba(6,20,48,.45); border: 1px solid var(--line-soft); }
.stat b { display: block; font: 800 22px/1.1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--gold-hi); }
.stat span { font-size: 12px; color: var(--muted); }
.stat.pend b { color: var(--warn); }

/* ---------- Minha disponibilidade ---------- */
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line-soft);
  background: rgba(14,38,88,.6); color: var(--ink); font: 600 13px var(--font-body); cursor: pointer;
  transition: background .2s, border-color .2s, transform .2s var(--ease);
}
.chip:active { transform: scale(.95); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.chip[aria-pressed="true"] { background: rgba(217,178,95,.16); border-color: var(--gold); color: var(--gold-hi); }
.days { display: flex; flex-direction: column; gap: 12px; }
.day { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms); }
.date { display: flex; flex-direction: column; align-items: center; padding-top: 10px; font-variant-numeric: tabular-nums; }
.date b { font: 800 26px/1 var(--font-display); }
.date span { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.date.sun b { color: var(--gold-hi); }
.slots { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.slot {
  position: relative; overflow: hidden; display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  width: 100%; padding: 12px 14px 12px 0; border-radius: var(--r-md); background: var(--card); border: 1px solid var(--line-soft);
  color: var(--ink); font: inherit; text-align: left; cursor: pointer; transition: background .25s, border-color .25s, transform .2s var(--ease);
}
.slot:active { transform: scale(.985); }
.slot .stripe { align-self: stretch; margin-block: -12px; background: var(--c); opacity: .85; }
.slot .t { min-width: 0; }
.slot .t b { display: block; font-weight: 600; font-size: 15px; }
.slot .t small { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.slot .t small em { font-style: normal; color: var(--c); font-weight: 600; }
.check { width: 30px; height: 30px; flex: none; }
.check circle { fill: transparent; stroke: rgba(159,176,208,.4); stroke-width: 2; transition: fill .3s, stroke .3s; }
.check path { fill: none; stroke: var(--on-gold); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset .35s var(--ease) .08s; }
.slot[aria-pressed="true"] { background: linear-gradient(100deg, rgba(217,178,95,.2), rgba(14,38,88,.85) 70%); border-color: rgba(217,178,95,.55); }
.slot[aria-pressed="true"] .check circle { fill: var(--gold); stroke: var(--gold-hi); }
.slot[aria-pressed="true"] .check path { stroke-dashoffset: 0; }
.slot.pop .check { animation: pop .45s var(--ease); }
.ripple { position: absolute; border-radius: 50%; pointer-events: none; background: rgba(247,226,166,.35); transform: scale(0); animation: ripple .6s ease-out forwards; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }
.note-card { padding: 16px; border-radius: var(--r-lg); background: rgba(14,38,88,.5); border: 1px dashed var(--line); display: flex; flex-direction: column; gap: 8px; }
.status-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.status-line .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
.status-line.ok .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.status-line.warn .dot { background: var(--warn); box-shadow: 0 0 8px var(--warn); }

.dock {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); z-index: 24;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--bg) 60%, rgba(6,20,48,0)); pointer-events: none;
}
.dock .inner { max-width: 448px; margin: 0 auto; pointer-events: auto; }
.badge { min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--on-gold); color: var(--gold-hi); font: 800 13px var(--font-display); font-variant-numeric: tabular-nums; }
.bump { animation: pop .4s var(--ease); }

/* ---------- Abas ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 26;
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));
  background: rgba(6, 18, 44, .97); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
}
.tabbar .inner { max-width: 480px; margin: 0 auto; height: var(--tabbar-h); display: grid; grid-template-columns: repeat(3, 1fr); position: relative; }
.tab { background: none; border: 0; color: var(--dim); font: 600 11.5px var(--font-body); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; position: relative; transition: color .25s; }
.tab svg { width: 24px; height: 24px; transition: transform .35s var(--ease); }
.tab[aria-selected="true"] { color: var(--gold-hi); }
.tab[aria-selected="true"] svg { transform: translateY(-2px) scale(1.08); }
.tab-ind { position: absolute; top: -1px; height: 3px; width: calc(100% / 3 - 40px); margin-left: 20px; border-radius: 0 0 4px 4px; background: var(--grad-gold); box-shadow: 0 0 14px rgba(217,178,95,.8); transition: transform .45s var(--ease); }

/* ---------- Calendário geral ---------- */
.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 999px; background: rgba(6,20,48,.6); border: 1px solid var(--line-soft); position: relative; }
.seg button { position: relative; z-index: 1; background: none; border: 0; color: var(--muted); font: 600 14px var(--font-body); padding: 9px 0; cursor: pointer; border-radius: 999px; transition: color .25s; }
.seg button[aria-pressed="true"] { color: var(--on-gold); }
.seg .knob { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 999px; background: var(--grad-gold); transition: transform .4s var(--ease); }
.seg.right .knob { transform: translateX(100%); }
.cal-wrap { padding: 12px 10px; border-radius: var(--r-lg); background: rgba(14,38,88,.55); border: 1px solid var(--line-soft); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .wd { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--dim); padding-bottom: 4px; }
.cal .wd.sun { color: var(--gold); }
.cell {
  min-height: 62px; min-width: 0; padding: 5px 4px 6px; border-radius: 12px; display: flex; flex-direction: column; align-items: stretch; gap: 3px;
  background: transparent; border: 1px solid transparent; color: var(--dim); font: inherit; text-align: left;
  animation: rise .4s var(--ease) both; animation-delay: calc(var(--i, 0) * 12ms);
}
.cell .n { font: 700 13px/1 var(--font-display); font-variant-numeric: tabular-nums; padding-left: 2px; }
.cell.has { background: rgba(19,48,112,.75); border-color: var(--line-soft); color: var(--ink); cursor: pointer; transition: border-color .2s, transform .2s var(--ease), background .2s; }
.cell.has:active { transform: scale(.95); }
.cell.sel { border-color: var(--gold); background: rgba(217,178,95,.16); box-shadow: 0 0 0 1px var(--gold) inset, 0 8px 20px -10px rgba(217,178,95,.7); }
.cell.today .n { color: var(--gold-hi); text-decoration: underline; text-underline-offset: 3px; }
.pill { display: flex; align-items: center; gap: 3px; font: 700 11px/1 var(--font-body); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); flex: none; }
.pill.zero { color: var(--dim); }
.pill.zero i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.pill.me i { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--gold-hi); }
.wk-scroll { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; margin-inline: -10px; padding-inline: 10px; -webkit-overflow-scrolling: touch; }
.wk-scroll::-webkit-scrollbar { display: none; }
.wk-scroll.sobra { mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
.wk { display: grid; gap: 5px; min-width: min-content; padding-right: 18px; }
.wk .wd.fino { letter-spacing: 0; }
.mcell.fino { padding-inline: 3px; align-items: center; }
.wk-dica { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 11.5px; color: var(--gold); margin: -2px 2px 8px; transition: opacity .3s; }
.wk-dica svg { width: 13px; height: 13px; animation: nudge 1.4s ease-in-out infinite; }
.wk-dica.fim { opacity: .35; }
.wk-dica.fim svg { animation: none; }
@keyframes nudge { 50% { transform: translateX(4px); } }
.mcal { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 6px; }
.wk .wd, .mcal .wd { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); padding-bottom: 4px; }
.mcal .wd.sun { color: var(--gold); }
.mcell {
  min-width: 0; min-height: 74px; padding: 6px 5px 7px; border-radius: 12px; display: flex; flex-direction: column; align-items: stretch; gap: 6px;
  background: transparent; border: 1px solid transparent; color: var(--ink); font: inherit; text-align: left;
  animation: rise .4s var(--ease) both; animation-delay: calc(var(--i, 0) * 14ms);
}
.nms { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; max-width: 100%; }
.mcell.faixa { grid-column: 1 / -1; min-height: 0; }
.mcell.faixa .nms { flex-direction: row; flex-wrap: wrap; }
.faixa-cultos { display: flex; flex-direction: column; gap: 8px; }
.mcell .n { font: 800 14px/1 var(--font-display); font-variant-numeric: tabular-nums; padding-left: 2px; }
.mcell.dom .n { color: var(--gold-hi); }
.mcell.vazio { min-height: 0; padding: 0; }
.mcell.sem { border: 1px solid transparent; color: var(--dim); min-height: 44px; }
.mcell.has { background: rgba(19,48,112,.78); border-color: var(--line-soft); cursor: pointer; transition: border-color .2s, transform .2s var(--ease), background .2s; }
.mcell.has:active { transform: scale(.97); }
.mcell.sel { border-color: var(--gold); background: rgba(217,178,95,.13); box-shadow: 0 0 0 1px var(--gold) inset, 0 10px 24px -12px rgba(217,178,95,.8); }
.mcell.today .n { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--gold); }
.mc { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; padding-left: 6px; border-left: 2px solid var(--c); }
.mh { font: 700 10.5px/1.2 var(--font-body); letter-spacing: .02em; color: var(--c); font-variant-numeric: tabular-nums; max-width: 100%; overflow-wrap: anywhere; }
.cn {
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font: 600 11.5px/1.3 var(--font-body); padding: 2px 6px; border-radius: 7px;
  background: rgba(238,242,251,.09); color: var(--ink);
  animation: rise .35s var(--ease) both; animation-delay: calc(var(--i, 0) * 14ms + 120ms);
}
.cn.me { background: var(--grad-gold); color: var(--on-gold); }
.cn.novo { animation: chega 1.6s var(--ease) both; }
@keyframes chega { 0% { opacity: 0; transform: scale(.6); } 25% { opacity: 1; transform: scale(1.12); box-shadow: 0 0 0 4px rgba(123,224,176,.45); } 100% { transform: none; box-shadow: 0 0 0 0 rgba(123,224,176,0); } }
.mais { font: 700 10.5px var(--font-body); color: var(--gold); padding-left: 2px; }
.nada { font-size: 10.5px; color: var(--dim); font-style: italic; }
.calm .mcell, .calm .cn:not(.novo), .calm .day, .calm .adm-day { animation: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; padding: 0 4px; font-size: 11.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }

.detail { display: flex; flex-direction: column; gap: 10px; animation: rise .4s var(--ease) both; }
.detail h3 { margin: 0; font: 700 19px/1.25 var(--font-display); }
.detail h3 span { color: var(--gold); }
.culto-card { border-radius: var(--r-md); background: var(--card); border: 1px solid var(--line-soft); overflow: hidden; display: grid; grid-template-columns: 4px minmax(0, 1fr); }
.culto-card .stripe { background: var(--c); }
.culto-card .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.culto-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.culto-head b { font-weight: 600; }
.culto-head b em { font-style: normal; color: var(--c); font-variant-numeric: tabular-nums; margin-left: 6px; font-size: 13px; }
.count { flex: none; font: 700 12px var(--font-body); font-variant-numeric: tabular-nums; color: var(--muted); }
.count strong { color: var(--gold-hi); font-size: 15px; font-family: var(--font-display); }
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.person { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: rgba(217,178,95,.12); border: 1px solid rgba(217,178,95,.3); font-size: 13px; font-weight: 500; max-width: 100%; }
.person .av { width: 22px; height: 22px; font-size: 9.5px; }
.person.me { background: var(--grad-gold); color: var(--on-gold); border-color: transparent; }
.person.me .av { background: rgba(36,23,3,.2); color: var(--on-gold); border-color: transparent; }
.person.muted { background: rgba(159,176,208,.08); border-color: var(--line-soft); color: var(--muted); }
.person.pend { background: rgba(255,178,122,.08); border-color: rgba(255,178,122,.3); color: #ffd3b3; }
.person .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.no-one { font-size: 13px; color: var(--dim); }
.unavail { font-size: 12.5px; color: var(--dim); }
.unavail b { color: var(--muted); font-weight: 600; }
.obs-list { display: flex; flex-direction: column; gap: 6px; }
.obs-item { font-size: 13px; color: var(--muted); padding: 8px 12px; border-radius: 12px; background: rgba(6,20,48,.45); border: 1px solid var(--line-soft); }
.obs-item b { color: var(--ink); font-weight: 600; }
.list-day { display: flex; flex-direction: column; gap: 8px; animation: rise .4s var(--ease) both; animation-delay: calc(var(--i, 0) * 30ms); }
.list-day > h4 { margin: 6px 0 0; font: 700 14px var(--font-display); color: var(--gold-hi); letter-spacing: .02em; }
.panel { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: var(--r-lg); background: rgba(14,38,88,.5); border: 1px solid var(--line-soft); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md); background: rgba(255,178,122,.08); border: 1px solid rgba(255,178,122,.3); color: #ffd9bd; font-size: 13px; }
.banner svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.empty { text-align: center; padding: 22px 12px; color: var(--muted); font-size: 14px; }
.empty b { display: block; color: var(--ink); font: 700 16px var(--font-display); margin-bottom: 4px; }

.live { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12.5px; color: var(--ok); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(123,224,176,.6); animation: livePulse 1.8s ease-out infinite; }
@keyframes livePulse { 70% { box-shadow: 0 0 0 8px rgba(123,224,176,0); } 100% { box-shadow: 0 0 0 0 rgba(123,224,176,0); } }
.calm.screen, .calm .cell, .calm .list-day, .calm .detail, .calm .profile .big { animation: none; }

/* ---------- Administrador ---------- */
.admin-on { border-color: var(--line); background: linear-gradient(160deg, rgba(217,178,95,.12), rgba(14,38,88,.6)); }
.admin-head { display: flex; gap: 12px; align-items: center; }
.admin-head svg { width: 34px; height: 34px; color: var(--gold-hi); flex: none; }
.admin-head b { display: block; font-family: var(--font-display); }
.admin-head span { font-size: 13px; color: var(--muted); }
.adm-msg { margin: 0; min-height: 1.2em; font-size: 13px; color: var(--warn); }
.add-ev { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 8px; }
.adm-list { display: flex; flex-direction: column; gap: 14px; }
.adm-day { display: flex; flex-direction: column; gap: 8px; animation: rise .4s var(--ease) both; animation-delay: calc(var(--i, 0) * 30ms); }
.adm-day h4 { margin: 0; font: 700 14px var(--font-display); color: var(--gold-hi); }
.adm-row { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 12px 10px 0; border-radius: var(--r-md); background: var(--card); border: 1px solid var(--line-soft); transition: opacity .3s, background .3s; overflow: hidden; }
.adm-row .stripe { align-self: stretch; margin-block: -10px; background: var(--c); }
.adm-row .t { min-width: 0; }
.adm-row .t b { display: block; font-weight: 600; }
.adm-row .t small { color: var(--muted); font-size: 12.5px; display: flex; gap: 6px; flex-wrap: wrap; }
.adm-row .t small em { font-style: normal; color: var(--c); font-weight: 600; }
.adm-row.off { opacity: .55; background: rgba(14,38,88,.35); }
.adm-row.off .t b { text-decoration: line-through; text-decoration-color: rgba(238,242,251,.5); }
.sw { position: relative; width: 50px; height: 30px; border-radius: 999px; border: 1px solid var(--line-soft); background: rgba(159,176,208,.18); cursor: pointer; transition: background .3s, border-color .3s; flex: none; }
.sw i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.4); transition: transform .35s var(--ease), background .3s; }
.sw[aria-checked="true"] { background: var(--gold); border-color: var(--gold-hi); }
.sw[aria-checked="true"] i { transform: translateX(20px); background: #fff8e1; }
.img-btn { color: var(--gold-hi); border-color: rgba(217,178,95,.45); background: rgba(217,178,95,.12); }
.img-btn .spinner { width: 15px; height: 15px; }
.icon-btn.danger { color: #ffb3b3; border-color: rgba(255,140,140,.3); }
.btn.warn { border-color: var(--warn); color: var(--warn); }

/* ---------- Usuário ---------- */
.profile { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 26px 16px; border-radius: var(--r-lg); background: linear-gradient(160deg, rgba(19,48,112,.95), rgba(10,31,74,.95)); border: 1px solid var(--line); }
.profile .big { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font: 800 30px var(--font-display); background: var(--grad-gold); color: var(--on-gold); box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px rgba(217,178,95,.5), 0 14px 40px -10px rgba(217,178,95,.6); animation: pop .6s var(--ease); }
.profile h2 { margin: 6px 0 0; font: 700 24px var(--font-display); }
.profile p { margin: 0; color: var(--muted); font-size: 14px; }
.kv { display: flex; flex-direction: column; gap: 0; }
.kv div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px; }
.kv div:last-child { border-bottom: 0; }
.kv span { color: var(--muted); }
.kv b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

.done-burst { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.toast {
  position: fixed; left: 50%; top: calc(76px + env(safe-area-inset-top, 0px)); z-index: 60;
  transform: translate(-50%, -16px); opacity: 0; pointer-events: none;
  padding: 11px 18px; border-radius: 999px; background: var(--ink); color: var(--bg);
  font-weight: 600; font-size: 14px; box-shadow: 0 12px 30px rgba(0,0,0,.4);
  transition: opacity .3s, transform .3s var(--ease); max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
#confetti { position: fixed; inset: 0; z-index: 50; pointer-events: none; width: 100%; height: 100%; }
.foot { text-align: center; font-size: 12px; color: var(--dim); letter-spacing: .08em; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
</style>

/* Cultos habituais do mês (antes dos ajustes do administrador). */
function cultosPadrao(ano, mes) {
  const total = new Date(ano, mes + 1, 0).getDate();
  let ultimaSexta = 0;
  for (let d = 1; d <= total; d++) if (new Date(ano, mes, d).getDay() === 5) ultimaSexta = d;
  const dias = [];
  for (let d = 1; d <= total; d++) {
    const dow = new Date(ano, mes, d).getDay();
    let tipos = [];
    if (dow === 0) tipos = ["edp", "cel1", "cel2"];
    else if (dow === 1) tipos = ["palavra"];
    else if (dow === 3) tipos = ["vitoria"];
    else if (dow === 5 && d === ultimaSexta) tipos = ["sobrenatural"];
    if (tipos.length) dias.push({ d, dow, cultos: tipos.map(t => ({ id: `${ano}-${pad(mes + 1)}-${pad(d)}-${t}`, tipo: t, d, dow, t: TIPOS[t] })) });
  }
  return dias;
}
function ajustesDo(ym) {
  const a = state.dados[ym]?.eventos || {};
  return { removidos: Array.isArray(a.removidos) ? a.removidos.map(String) : [], extras: Array.isArray(a.extras) ? a.extras.filter(e => e && e.id && e.data && e.nome) : [] };
}
const minutos = h => { const m = /^(\d{1,2}):(\d{2})$/.exec(h || ""); return m ? +m[1] * 60 + +m[2] : 9999; };
function eventoComoCulto(e, ano, mes) {
  const d = +String(e.data).slice(8, 10), dow = new Date(ano, mes, d).getDay();
  const nome = String(e.nome).slice(0, 40), hora = String(e.hora || "").slice(0, 5);
  return { id: String(e.id), tipo: "evento", d, dow, extra: true, t: { nome, curto: nome, hora, cor: TIPOS.evento.cor, chip: TIPOS.evento.chip } };
}
/* Cultos que valem no mês: os habituais, menos os retirados, mais os eventos criados pelo administrador. */
function cultosDoMes(ano, mes) {
  const ym = `${ano}-${pad(mes + 1)}`, total = new Date(ano, mes + 1, 0).getDate();
  const aj = ajustesDo(ym), fora = new Set(aj.removidos);
  const porDia = new Map();
  for (const dia of cultosPadrao(ano, mes)) porDia.set(dia.d, dia.cultos.filter(c => !fora.has(c.id)));
  for (const e of aj.extras) {
    const d = +String(e.data).slice(8, 10);
    if (!String(e.data).startsWith(ym + "-") || !(d >= 1 && d <= total)) continue;
    if (!porDia.has(d)) porDia.set(d, []);
    porDia.get(d).push(eventoComoCulto(e, ano, mes));
  }
  return [...porDia.entries()].filter(([, cs]) => cs.length).sort((a, b) => a[0] - b[0])
    .map(([d, cs]) => ({ d, dow: new Date(ano, mes, d).getDay(), cultos: cs.sort((a, b) => (a.extra === b.extra ? 0 : a.extra ? 1 : -1) || (a.extra ? minutos(a.t.hora) - minutos(b.t.hora) : 0)) }));
}

/* ===================== ARMAZENAMENTO =====================
   Escolhido sozinho:
   1) Dentro do Claude (prévia): banco do próprio artifact.
   2) Firebase (CONFIG.firebase): todos veem as respostas de todos, ao vivo.
   3) Só neste aparelho: quando nada acima estiver disponível.
   Cada backend tem: observar(ym, aoReceber, aoFalhar) -> parar, salvar(resposta), addNome(nome). */
const local = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "x";
const mesmoNome = (a, b) => slug(a) === slug(b);
function comTempo(p, ms = 15000) { return Promise.race([p, new Promise((_, r) => setTimeout(() => r(Object.assign(new Error("tempo"), { code: "tempo" })), ms))]); }
function juntar(cb) {
  const v = { respostas: null, obreiros: null, eventos: null };
  const emitir = () => { if (v.respostas && v.obreiros && v.eventos) cb({ ...v }); };
  return {
    respostas(x) { v.respostas = x; emitir(); },
    obreiros(x) { v.obreiros = x; emitir(); },
    eventos(x) { v.eventos = x || {}; emitir(); },
  };
}
async function sha256(txt) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
/* Admin sem Firebase (prévia): confere a senha pelo hash e lembra neste aparelho. */
const adminSimples = {
  async entrar(senha) { if ((await sha256(senha)) !== SENHA_HASH) throw Object.assign(new Error("senha"), { code: "senha" }); local.set("advec:admin", true); return true; },
  async sair() { local.del("advec:admin"); },
  async restaurar() { return !!local.get("advec:admin"); },
};

function backendLocal() {
  const K = "advec:banco-local";
  const ler = () => ({ respostas: {}, obreiros: [], eventos: {}, ...(local.get(K) || {}) });
  const ouvintes = new Set();
  const avisar = () => ouvintes.forEach(f => f());
  return {
    modo: "local", compartilhado: false, aoVivo: false,
    observar(ym, cb) {
      const f = () => { const b = ler(); cb({ respostas: Object.values(b.respostas[ym] || {}), obreiros: b.obreiros, eventos: b.eventos[ym] || {} }); };
      ouvintes.add(f); setTimeout(f, 0);
      return () => ouvintes.delete(f);
    },
    async salvar(r) { const b = ler(); (b.respostas[r.mes] ||= {})[slug(r.nome)] = r; local.set(K, b); avisar(); },
    async addNome(nome) { const b = ler(); if (!b.obreiros.some(n => mesmoNome(n, nome))) b.obreiros.push(nome); local.set(K, b); avisar(); },
    async salvarEventos(ym, aj) { const b = ler(); b.eventos[ym] = aj; local.set(K, b); avisar(); },
    admin: adminSimples,
  };
}
function backendArtifact(db) {
  return {
    modo: "artifact", compartilhado: true, aoVivo: true,
    observar(ym, cb, falha) {
      const j = juntar(cb);
      const u1 = db.collection("respostas").where("mes", "==", ym).onSnapshot(s => j.respostas(s.docs.map(d => d.data())), falha);
      const u2 = db.collection("obreiros").onSnapshot(s => j.obreiros(s.docs.map(d => String(d.data().nome || "")).filter(Boolean)), falha);
      const u3 = db.doc(`eventos/${ym}`).onSnapshot(s => j.eventos(s.exists ? s.data() : {}), falha);
      return () => { u1(); u2(); u3(); };
    },
    salvar: r => db.doc(`respostas/${r.mes}_${slug(r.nome)}`).set(r),
    addNome: nome => db.doc(`obreiros/${slug(nome)}`).set({ nome }),
    salvarEventos: (ym, aj) => db.doc(`eventos/${ym}`).set(aj),
    admin: adminSimples,
  };
}
function carregarScript(src) {
  return new Promise((ok, falha) => {
    const el = document.createElement("script");
    el.src = src; el.onload = ok; el.onerror = () => falha(new Error("Não carregou " + src));
    document.head.append(el);
  });
}
async function backendFirebase(cfg) {
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  if (!window.firebase) await carregarScript(base + "firebase-app-compat.js");
  if (!window.firebase.firestore) await carregarScript(base + "firebase-firestore-compat.js");
  if (!firebase.apps.length) firebase.initializeApp(cfg);
  const fs = firebase.firestore();
  // Guarda uma cópia no aparelho: abre rápido e funciona sem internet (envia quando voltar).
  try { await fs.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
  return {
    modo: "firebase", compartilhado: true, aoVivo: true,
    observar(ym, cb, falha) {
      const j = juntar(cb);
      const u1 = fs.collection("respostas").where("mes", "==", ym).onSnapshot(s => j.respostas(s.docs.map(d => d.data())), falha);
      const u2 = fs.collection("obreiros").onSnapshot(s => j.obreiros(s.docs.map(d => String(d.data().nome || "")).filter(Boolean)), falha);
      const u3 = fs.doc(`eventos/${ym}`).onSnapshot(s => j.eventos(s.exists ? s.data() : {}), falha);
      return () => { u1(); u2(); u3(); };
    },
    salvar: r => fs.doc(`respostas/${r.mes}_${slug(r.nome)}`).set(r),
    addNome: nome => fs.doc(`obreiros/${slug(nome)}`).set({ nome }),
    salvarEventos: (ym, aj) => fs.doc(`eventos/${ym}`).set(aj),
    // Administrador = login do Firebase Authentication (e-mail fixo + senha da igreja).
    admin: {
      async carregar() {
        if (!firebase.auth) await carregarScript(base + "firebase-auth-compat.js");
        const auth = firebase.auth();
        await new Promise(ok => { const u = auth.onAuthStateChanged(() => { u(); ok(); }); });
        return auth;
      },
      async entrar(senha) {
        const auth = await this.carregar();
        await auth.signInWithEmailAndPassword(CONFIG.adminEmail, senha);
        local.set("advec:admin", true); return true;
      },
      async sair() { local.del("advec:admin"); if (firebase.auth) await firebase.auth().signOut(); },
      async restaurar() {
        if (!local.get("advec:admin")) return false;
        const auth = await this.carregar();
        return !!auth.currentUser && auth.currentUser.email === CONFIG.adminEmail;
      },
    },
  };
}
let backend = null;
const backendPronto = (async () => {
  if (window.claude && typeof window.claude.use === "function") {
    try { const db = await window.claude.use("db"); if (db) return (backend = backendArtifact(db)); } catch (e) {}
  }
  if (CONFIG.firebase && CONFIG.firebase.projectId) {
    try { return (backend = await comTempo(backendFirebase(CONFIG.firebase), 20000)); } catch (e) {}

const state = {

  tab: "agenda",
  offset: 0,
  sel: new Set(), obs: "", dirty: false,
  extras: local.get("advec:extras") || [],

const mesAtual = () => { const m = new Date(base.getFullYear(), base.getMonth() + state.offset, 1); return { ano: m.getFullYear(), mes: m.getMonth(), ym: `${m.getFullYear()}-${pad(m.getMonth() + 1)}` }; };
const chaveRascunho = () => `advec:rascunho:${slug(state.nome)}:${mesAtual().ym}`;
function lerRascunho() {
  const r = local.get(chaveRascunho());
  state.sel = new Set(r?.sel || []); state.obs = r?.obs || ""; state.dirty = !!r?.dirty;
}
function guardarRascunho() { local.set(chaveRascunho(), { sel: [...state.sel], obs: state.obs, dirty: state.dirty }); }
function todosNomes() {
  const lista = [...CONFIG.obreiros];
  const add = n => { if (n && !lista.some(x => mesmoNome(x, n))) lista.push(n); };
  state.extras.forEach(add);
  Object.values(state.dados).forEach(d => (d.respostas || []).forEach(r => add(r.nome)));
  return lista;
}
function minhaResposta(ym) { return (state.dados[ym]?.respostas || []).find(r => mesmoNome(r.nome, state.nome)); }

let assinatura = { ym: null, parar: null };
let calNomesVistos = new Set(), calRolagemX = 0, calPosRender = null;
function carregarMes(ym, { forcar = false } = {}) {
  if (assinatura.ym === ym && !forcar) return;
  if (assinatura.parar) assinatura.parar();
  assinatura = { ym, parar: null };
  const atual = state.dados[ym];
  state.dados[ym] = { status: atual?.status === "ok" && !forcar ? "ok" : "carregando", respostas: atual?.respostas || [], eventos: atual?.eventos || {}, erro: "" };
  aoMudarDados(ym);
  backendPronto.then(() => {
    if (assinatura.ym !== ym) return;
    const relogio = setTimeout(() => {
      const d = state.dados[ym];
      if (assinatura.ym === ym && d.status === "carregando") { d.status = "erro"; d.erro = "tempo"; aoMudarDados(ym); }
    }, 12000);
    assinatura.parar = backend.observar(ym,
      r => { clearTimeout(relogio); if (assinatura.ym === ym) aplicarDados(ym, r); },
      e => {
        clearTimeout(relogio);
        const d = state.dados[ym]; d.status = "erro"; d.erro = e && e.code || "erro";
        if (assinatura.ym === ym) assinatura = { ym: null, parar: null }; // permite tentar de novo
        aoMudarDados(ym);
      });
  });
}
function aplicarDados(ym, r) {
  const extras = r.obreiros.filter(n => !CONFIG.obreiros.some(x => mesmoNome(x, n)));
  state.extras = [...new Set([...state.extras, ...extras])]; local.set("advec:extras", state.extras);
  const antes = state.dados[ym];
  const novas = r.respostas
    .map(x => ({ nome: String(x.nome || ""), cultos: Array.isArray(x.cultos) ? x.cultos.map(String) : [], obs: String(x.obs || ""), atualizado: String(x.atualizado || "") }))
    .filter(x => x.nome);
  // Avisa quando outra pessoa salvou enquanto o calendário está aberto.
  if (antes?.status === "ok" && state.tab === "calendario" && state.nome) {
    const mudou = novas.filter(n => !mesmoNome(n.nome, state.nome) && !antes.respostas.some(a => mesmoNome(a.nome, n.nome) && a.atualizado === n.atualizado));
    if (mudou.length === 1) toast(`${mudou[0].nome} atualizou a disponibilidade`);
    else if (mudou.length > 1) toast(`${mudou.length} obreiros atualizaram a disponibilidade`);
  }
  const eventosMudaram = JSON.stringify(antes?.eventos || {}) !== JSON.stringify(r.eventos || {});
  state.dados[ym] = { status: "ok", respostas: novas, eventos: r.eventos || {}, erro: "" };
  aoMudarDados(ym, eventosMudaram && antes?.status === "ok");
}

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(c));
  return el;
}

async function copiarResumo(dias, resp, faltam) {
  const { ano, mes } = mesAtual();
  const L = [`*DISPONIBILIDADE DOS OBREIROS · ${CONFIG.igreja}*`, `*${MESES[mes].toUpperCase()} DE ${ano}*`, `Responderam: ${resp.length} · Faltam: ${faltam.length}`];
  for (const dia of dias) {
    L.push("", `*${DOW[dia.dow]} ${pad(dia.d)}/${pad(mes + 1)}*`);
    for (const c of dia.cultos) {
      const t = c.t, sim = resp.filter(r => r.cultos.includes(c.id)).map(r => r.nome);
      L.push(`• ${t.nome}${t.hora ? " " + t.hora : ""} (${sim.length}): ${sim.join(", ") || "ninguém"}`);
    }
  }
  if (faltam.length) L.push("", `⏳ Faltam responder: ${faltam.join(", ")}`);
  const obs = resp.filter(r => r.obs); if (obs.length) { L.push("", "📝 Observações:"); obs.forEach(r => L.push(`• ${r.nome}: ${r.obs}`)); }
  const texto = L.join("\n");
  try { await navigator.clipboard.writeText(texto); toast("Resumo copiado. É só colar no WhatsApp."); }
  catch (e) {
    const ta = h("textarea", { class: "input", rows: "8", readonly: true, style: "font-size:12px" }); ta.value = texto;
    document.querySelector(".screen").append(ta); ta.focus(); ta.select(); toast("Texto selecionado abaixo. Toque em Copiar.");
  }
}

const TITULO_IMG = { edp: "EDP 9:00", cel1: "C. CELEBRAÇÃO 10:15", cel2: "C. CELEBRAÇÃO 18:30", palavra: "CULTO DA PALAVRA", vitoria: "CULTO DA VITÓRIA", sobrenatural: "C. SOBRENATURAL" };

async function baixarArquivo(blob, nome) {

    const dl = await window.claude.use("downloads").catch(() => null);

  const a = h("a", { href: url, download: nome, style: "display:none" });

function carregarImagem(src) { return new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; }); }
async function desenharCalendario(ano, mes, dias, resp) {
  const W = 1600, ESC = 2;
  const FT = '"Inter", Arial, Helvetica, sans-serif', FD = '"Sora", "Inter", Arial, sans-serif';
  const C = { faixa: "#2e3796", faixa2: "#232a7a", num: "#1b2a8f", tit: "#9c2b22", txt: "#262a36", vazio: "#8b90a3", grade: "#8f98c8", creme: "#fbf8e3", branco: "#ffffff", rodape: "#5b6178" };
  const COLS = [400, 200, 200, 200, 200, 200, 200];
  const X = COLS.reduce((a, w, i) => (a.push(a[i] + w), a), [0]);
  const porDia = new Map(dias.map(d => [d.d, d]));
  const primeiro = new Date(ano, mes, 1).getDay(), total = new Date(ano, mes + 1, 0).getDate();
  const nSem = Math.ceil((primeiro + total) / 7);
  const ordemNome = (a, b) => (/^dc/i.test(a) === /^dc/i.test(b) ? 0 : /^dc/i.test(a) ? -1 : 1) || semCargo(a).localeCompare(semCargo(b));
  const disp = id => resp.filter(r => r.cultos.includes(id)).map(r => r.nome).sort(ordemNome);
  const titulo = c => c.extra ? (c.t.nome + (c.t.hora ? " " + c.t.hora : "")).toUpperCase() : TITULO_IMG[c.tipo] || c.t.nome.toUpperCase();

  const med = document.createElement("canvas").getContext("2d");
  const fTit = `600 15px ${FT}`, fNome = `400 15px ${FT}`, fVazio = `italic 400 13.5px ${FT}`, fNum = `700 21px ${FT}`;
  const LT = 20, LN = 19.5, GAP = 11;
  function quebrar(txt, max1, max) {
    med.font = fTit;
    const out = []; let l = "";
    for (const p of txt.split(/\s+/)) {
      const t = l ? l + " " + p : p, lim = out.length ? max : max1;
      if (l && med.measureText(t).width > lim) { out.push(l); l = p; } else l = t;
    }
    if (l) out.push(l);
    return out;
  }
  function cortar(txt, max, font) {
    med.font = font; if (med.measureText(txt).width <= max) return txt;
    while (txt.length > 1 && med.measureText(txt + "…").width > max) txt = txt.slice(0, -1);
    return txt + "…";
  }
  // monta uma coluna de texto: [{font, cor, txt, x, y}], altura
  function coluna(cultos, larg, recuo) {
    const ops = []; let y = 0;
    cultos.forEach((c, i) => {
      if (i) y += GAP;
      quebrar(titulo(c), larg - (y === 0 ? recuo : 0), larg).forEach((l, j) => {
        ops.push({ font: fTit, cor: C.tit, txt: l, x: y === 0 && j === 0 ? recuo : 0, y }); y += LT;
      });
      y += 4;
      const nomes = disp(c.id);
      if (!nomes.length) { ops.push({ font: fVazio, cor: C.vazio, txt: "ninguém disponível", x: 0, y }); y += LN; }
      nomes.forEach(n => { ops.push({ font: fNome, cor: C.txt, txt: cortar(n, larg, fNome), x: 0, y }); y += LN; });
    });
    return { ops, alt: y };
  }
  // layout de cada célula
  const celulas = [];
  for (let d = 1; d <= total; d++) {
    const pos = primeiro + d - 1, w = Math.floor(pos / 7), col = pos % 7;
    const dia = porDia.get(d);
    med.font = fNum; const recuo = med.measureText(String(d)).width + 14;
    const cel = { d, w, col, colunas: [] };
    if (dia) {
      if (col === 0) {
        const manha = dia.cultos.filter(c => c.tipo === "edp" || c.tipo === "cel1"), resto = dia.cultos.filter(c => !manha.includes(c));
        if (manha.length && resto.length) {
          cel.colunas.push({ dx: 10, ...coluna(manha, 184, recuo) }, { dx: 208, ...coluna(resto, 184, 0) });
        } else cel.colunas.push({ dx: 10, ...coluna(dia.cultos, COLS[0] - 20, recuo) });
      } else cel.colunas.push({ dx: 8, ...coluna(dia.cultos, COLS[col] - 16, recuo) });
    }
    cel.alt = Math.max(0, ...cel.colunas.map(c => c.alt));
    celulas.push(cel);
  }
  const TOPO = 112, CAB = 34, RODAPE = 40, MINL = 132, PADV = 10;
  const alturas = Array.from({ length: nSem }, (_, w) => Math.max(MINL, ...celulas.filter(c => c.w === w).map(c => c.alt + PADV * 2 + 4)));
  const Y = alturas.reduce((a, hgt, i) => (a.push(a[i] + hgt), a), [TOPO + CAB]);
  const H = Y[nSem] + RODAPE;

  const cv = document.createElement("canvas");
  cv.width = W * ESC; cv.height = H * ESC;
  const g = cv.getContext("2d"); g.scale(ESC, ESC); g.textBaseline = "top";
  g.fillStyle = C.branco; g.fillRect(0, 0, W, H);

  // faixa do título
  const grad = g.createLinearGradient(0, 0, 0, TOPO); grad.addColorStop(0, C.faixa); grad.addColorStop(1, C.faixa2);
  g.fillStyle = grad; g.fillRect(0, 0, W, TOPO);
  const logo = await carregarImagem(LOGO);
  if (logo) {
    g.save(); g.beginPath(); g.arc(70, TOPO / 2, 40, 0, Math.PI * 2); g.closePath(); g.clip();
    g.drawImage(logo, 30, TOPO / 2 - 40, 80, 80); g.restore();
    g.strokeStyle = "#d9b25f"; g.lineWidth = 3; g.beginPath(); g.arc(70, TOPO / 2, 40, 0, Math.PI * 2); g.stroke();
  }
  g.fillStyle = "#ffffff"; g.textAlign = "center";
  g.font = `800 30px ${FD}`; g.fillText("ESCALA DOS OBREIROS PARA OS CULTOS E EVENTOS", W / 2, 18);
  g.font = `800 26px ${FD}`; g.fillText(`MÊS ${MESES[mes].toUpperCase()} ${ano}`, W / 2, 62);

  // cabeçalho dos dias
  g.fillStyle = C.faixa; g.fillRect(0, TOPO, W, CAB);
  g.font = `700 17px ${FT}`; g.fillStyle = "#ffffff"; g.textAlign = "center";
  ["Domingo", "Segunda-Feira", "Terça-Feira", "Quarta-Feira", "Quinta-Feira", "Sexta-Feira", "Sábado"].forEach((n, i) => g.fillText(n, X[i] + COLS[i] / 2, TOPO + 8));
  g.textAlign = "left";

  // fundos das colunas (domingo e sábado em creme)
  for (let w = 0; w < nSem; w++) for (let i = 0; i < 7; i++) {
    g.fillStyle = i === 0 || i === 6 ? C.creme : C.branco;
    g.fillRect(X[i], Y[w], COLS[i], alturas[w]);
  }
  // conteúdo
  for (const cel of celulas) {
    const x0 = X[cel.col], y0 = Y[cel.w];
    g.font = fNum; g.fillStyle = C.num; g.fillText(String(cel.d), x0 + 8, y0 + PADV - 2);
    for (const coluna of cel.colunas) for (const op of coluna.ops) {

  for (let w = 0; w <= nSem; w++) { g.beginPath(); g.moveTo(0, Y[w] + .5); g.lineTo(W, Y[w] + .5); g.stroke(); }
  for (let i = 1; i < 7; i++) { g.beginPath(); g.moveTo(X[i] + .5, TOPO + CAB); g.lineTo(X[i] + .5, Y[nSem]); g.stroke(); }
  g.strokeStyle = C.faixa2; g.lineWidth = 2; g.strokeRect(1, 1, W - 2, Y[nSem] - 1);

  // rodapé
  const agora = new Date();
  g.font = `500 13px ${FT}`; g.fillStyle = C.rodape;
  g.fillText("ASSEMBLEIA DE DEUS VITÓRIA EM CRISTO · disponibilidade informada pelos obreiros no app", 16, Y[nSem] + 13);
  g.textAlign = "right";
  g.fillText(`Responderam ${resp.length} de ${todosNomes().length} · gerado em ${pad(agora.getDate())}/${pad(agora.getMonth() + 1)}/${agora.getFullYear()} às ${pad(agora.getHours())}:${pad(agora.getMinutes())}`, W - 16, Y[nSem] + 13);

  return await new Promise((ok, falha) => cv.toBlob(b => b ? ok(b) : falha(new Error("png")), "image/png"));
}

            n ? ` · ${n} ${n === 1 ? "marcou" : "marcaram"}` : "")),
          padrao
            ? h("button", { class: "sw", role: "switch", "aria-checked": String(on), "aria-label": `${c.t.nome} em ${pad(d)}/${pad(mes + 1)}`,
                onclick: () => {
                  const rem = new Set(aj.removidos); on ? rem.add(c.id) : rem.delete(c.id);
                  gravarAjustes(ym, { ...aj, removidos: [...rem] }, on ? `${c.t.nome} do dia ${pad(d)} retirado` : `${c.t.nome} do dia ${pad(d)} voltou`);
                } }, h("i"))
            : h("button", { class: "icon-btn danger", "aria-label": `Excluir ${c.t.nome}`,
                onclick: () => gravarAjustes(ym, { ...aj, extras: aj.extras.filter(x => x.id !== e.id) }, `Evento "${c.t.nome}" excluído`) }, svg(ICON.trash)));
      }));
  }));

  const mudado = aj.removidos.length || aj.extras.length;
  const restaurar = h("button", { class: "btn btn-ghost btn-block" + (confirmarRestaurar > Date.now() ? " warn" : ""), disabled: !mudado, onclick: () => {
    if (confirmarRestaurar > Date.now()) { confirmarRestaurar = 0; gravarAjustes(ym, { removidos: [], extras: [] }, "Mês voltou aos dias habituais"); }
    else { confirmarRestaurar = Date.now() + 4000; telaAdmin(true); setTimeout(() => { if (state.tab === "admin") telaAdmin(true); }, 4100); }
  } }, svg(ICON.refresh), confirmarRestaurar > Date.now() ? "Toque de novo para confirmar" : "Voltar aos dias habituais");

  app.replaceChildren(h("section", { class: "screen" + (calmo ? " calm" : "") },
    topbar("Cultos e eventos"),
    h("div", { class: "summary wide" }, h("div", {},
      h("div", { class: "month" }, h("h2", {}, MESES[mes] + " ", h("span", {}, String(ano))), navMes()),
      h("p", {}, `${ativos} cultos e eventos neste mês. Os dias habituais já vêm prontos: desligue o que não vai acontecer e adicione o que for diferente. Os obreiros veem as mudanças na hora.`))),
    addForm,
    h("p", { class: "section-label" }, "Cultos do mês"),
    lista,
    restaurar,
    h("button", { class: "btn btn-ghost btn-sm", onclick: () => { state.tab = "usuario"; render(); } }, svg(ICON.left), "Voltar")));
}
async function gravarAjustes(ym, aj, msg) {
  const antes = state.dados[ym]?.eventos;
  const limpo = { removidos: [...new Set(aj.removidos)].slice(0, 100), extras: aj.extras.slice(0, 40).map(e => ({ id: e.id, data: e.data, nome: e.nome, hora: e.hora || "" })), atualizado: new Date().toISOString() };
  (state.dados[ym] ||= { status: "ok", respostas: [] }).eventos = limpo;
  const y = window.scrollY; telaAdmin(true); window.scrollTo({ top: y });
  try {
    await backendPronto;
    await comTempo(backend.salvarEventos(ym, limpo));
    vibrar(15); toast(msg);
  } catch (e) {
    if (e && e.code === "tempo" && backend?.modo === "firebase") { toast("Sem internet: a mudança será enviada quando a conexão voltar."); return; }
    state.dados[ym].eventos = antes || {};
    telaAdmin(true); window.scrollTo({ top: y });
    toast(e && e.code === "permission-denied" ? "O Firebase recusou: entre de novo como administrador." : "Não foi possível salvar. Tente de novo.");
  }
}
function trocarUsuario() {
  if (state.dirty) guardarRascunho();
  state.nome = ""; local.del("advec:nome"); state.sel = new Set(); state.obs = ""; state.dirty = false;
  render();
}

/* ---------- confete dourado ---------- */
function confete() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cores = ["#f7e2a6", "#d9b25f", "#a67c2e", "#ffffff", "#7fb2ff"];
  const ps = Array.from({ length: 120 }, () => ({
    x: innerWidth / 2, y: innerHeight * 0.7, vx: (Math.random() - .5) * 12, vy: -Math.random() * 15 - 6,
    r: Math.random() * 5 + 3, a: Math.random() * Math.PI, va: (Math.random() - .5) * .3,
    c: cores[(Math.random() * cores.length) | 0], f: Math.random() < .5 }));
  let t = 0;
  (function frame() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) {
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - t / 140);
      p.f ? ctx.fillRect(-p.r, -p.r / 3, p.r * 2, p.r / 1.5) : (ctx.beginPath(), ctx.arc(0, 0, p.r / 2, 0, 7), ctx.fill());
      ctx.restore();
    }
    if (++t < 140) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

/* ---------- início ---------- */
if (state.nome) { lerRascunho(); render(); carregarMes(mesAtual().ym); } else render();
backendPronto.then(async () => {
  try { state.admin = await backend.admin.restaurar(); } catch (e) { state.admin = false; }
  if (state.nome && state.tab === "usuario") telaUsuario(true);
});
</script>
