<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Escala ADVEC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Escala de Obreiros ADVEC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap">
<style>
/* Layout: uma coluna de app (máx. 480px), fundo azul profundo do brasão, dourado como luz e destaque. Tema único e escuro, por escolha. */
:root {
  --bg: #061430;
  --bg-2: #0a1f4a;
  --surface: #0e2658;
  --surface-2: #133070;
  --line: rgba(217, 178, 95, 0.18);
  --line-soft: rgba(159, 176, 208, 0.14);
  --ink: #eef2fb;
  --muted: #9fb0d0;
  --gold: #d9b25f;
  --gold-hi: #f7e2a6;
  --gold-lo: #9f7428;
  --on-gold: #241703;
  --ok: #7be0b0;
  --grad-gold: linear-gradient(135deg, #f7e2a6 0%, #d9b25f 45%, #a67c2e 100%);
  --font-display: "Sora", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg: 22px;
  --r-md: 16px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
/* Luz ambiente dourada */
.ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.ambient i {
  position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%;
  filter: blur(60px); opacity: .22;
  background: radial-gradient(circle, rgba(217,178,95,.55), transparent 62%);
  animation: drift 18s ease-in-out infinite alternate;
}
.ambient i:nth-child(1) { top: -35vmax; right: -30vmax; }
.ambient i:nth-child(2) { bottom: -40vmax; left: -35vmax; opacity: .14; animation-duration: 24s; background: radial-gradient(circle, rgba(90,140,255,.6), transparent 62%); }
@keyframes drift { to { transform: translate(-6vmax, 5vmax) scale(1.08); } }

.app {
  position: relative; z-index: 1;
  max-width: 480px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 140px;
}
.screen { display: flex; flex-direction: column; gap: 20px; animation: screenIn .55s var(--ease) both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(14px); } }

/* ---------- Tela 1: boas-vindas ---------- */
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding-top: 36px; }
.seal { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
.seal::before {
  content: ""; position: absolute; inset: -6px; border-radius: 50%;
  background: conic-gradient(from 0deg, #a67c2e, #f7e2a6, #d9b25f, #6f4f17, #f7e2a6, #a67c2e);
  animation: spin 9s linear infinite;
}
.seal::after {
  content: ""; position: absolute; inset: -26px; border-radius: 50%;
  background: radial-gradient(circle, rgba(217,178,95,.38), transparent 66%);
  animation: glow 3.2s ease-in-out infinite;
  z-index: -1;
}
.seal img { position: relative; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--bg); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes glow { 50% { transform: scale(1.08); opacity: .6; } }
.eyebrow { font-family: var(--font-display); font-weight: 600; letter-spacing: .32em; text-transform: uppercase; font-size: 12px; color: var(--gold); }
h1 {
  margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 9vw, 38px); line-height: 1.08;
  text-wrap: balance; letter-spacing: -.02em;
  background: linear-gradient(100deg, var(--gold-hi) 0%, var(--gold) 30%, #fff6d8 50%, var(--gold) 70%, var(--gold-hi) 100%);
  background-size: 220% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: sheen 6s ease-in-out infinite;
}
@keyframes sheen { 0%, 100% { background-position: 0% 0; } 50% { background-position: 100% 0; } }
.lead { margin: 0; color: var(--muted); max-width: 34ch; text-wrap: balance; }
.lead b { color: var(--ink); font-weight: 600; }

.section-label { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0; }
.names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.name {
  display: flex; align-items: center; gap: 10px; min-width: 0;
  padding: 12px 12px; border-radius: var(--r-md);
  background: rgba(14, 38, 88, .72); border: 1px solid var(--line-soft);
  color: var(--ink); font: inherit; font-weight: 500; text-align: left; cursor: pointer;
  transition: transform .2s var(--ease), border-color .2s, background .2s;
  animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 35ms + 150ms);
}
.name:active { transform: scale(.97); }
.name .av {
  flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 13px;
  background: var(--surface-2); color: var(--gold-hi); border: 1px solid var(--line);
}
.name .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.name .nm small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
.name[aria-pressed="true"] { background: rgba(217,178,95,.14); border-color: var(--gold); }
.name[aria-pressed="true"] .av { background: var(--grad-gold); color: var(--on-gold); border-color: transparent; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); }
.input, textarea.input {
  width: 100%; padding: 13px 14px; border-radius: var(--r-md);
  background: rgba(14, 38, 88, .72); border: 1px solid var(--line-soft); color: var(--ink);
  font: inherit; outline: none; transition: border-color .2s, box-shadow .2s; resize: vertical;
}
.input::placeholder { color: #6f82a8; }
.input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(217,178,95,.15); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 54px; padding: 0 22px; border-radius: 999px; border: 0; cursor: pointer;
  font: 700 16px/1 var(--font-display); letter-spacing: .01em; text-decoration: none;
  transition: transform .2s var(--ease), opacity .2s, box-shadow .3s;
}
.btn:active { transform: scale(.97); }
.btn-gold { background: var(--grad-gold); color: var(--on-gold); box-shadow: 0 10px 30px -8px rgba(217,178,95,.55), inset 0 1px 0 rgba(255,255,255,.5); position: relative; overflow: hidden; }
.btn-gold::after {
  content: ""; position: absolute; inset: 0; transform: translateX(-120%);
  background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%);
  animation: shine 3.4s ease-in-out infinite 1.2s;
}
@keyframes shine { 0% { transform: translateX(-120%); } 40%, 100% { transform: translateX(120%); } }
.btn-gold[disabled] { opacity: .35; box-shadow: none; cursor: not-allowed; }
.btn-gold[disabled]::after { display: none; }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line-soft); }
.btn-wa { background: #25d366; color: #052e16; box-shadow: 0 10px 30px -10px rgba(37,211,102,.6); }
.btn-block { width: 100%; }
.btn svg { width: 20px; height: 20px; flex: none; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }

/* ---------- Tela 2: cultos ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
  background: rgba(6, 20, 48, .96); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line-soft);
  display: flex; align-items: center; gap: 12px;
}
.topbar img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; flex: none; }
.who { min-width: 0; flex: 1; }
.who .hi { font-size: 12px; color: var(--muted); }
.who .nm { font-family: var(--font-display); font-weight: 700; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-btn { background: none; border: 0; color: var(--gold); font: 600 13px var(--font-body); cursor: pointer; padding: 8px 4px; }

.summary {
  display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center;
  padding: 18px; border-radius: var(--r-lg);
  background: linear-gradient(160deg, rgba(19,48,112,.95), rgba(10,31,74,.95));
  border: 1px solid var(--line);
  box-shadow: 0 20px 40px -24px rgba(0,0,0,.8);
}
.ring { position: relative; width: 84px; height: 84px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: rgba(159,176,208,.16); stroke-width: 8; }
.ring .bar { fill: none; stroke: url(#goldGrad); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .7s var(--ease); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-variant-numeric: tabular-nums; }
.ring .val b { display: block; font: 800 24px/1 var(--font-display); color: var(--gold-hi); }
.ring .val span { font-size: 11px; color: var(--muted); }
.month { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month h2 { margin: 0; font: 700 21px/1.2 var(--font-display); }
.month h2 span { color: var(--gold); }
.arrows { display: flex; gap: 6px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(159,176,208,.08); border: 1px solid var(--line-soft); color: var(--ink); cursor: pointer;
}
.icon-btn[disabled] { opacity: .3; cursor: default; }
.icon-btn svg { width: 16px; height: 16px; }
.summary p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line-soft);
  background: rgba(14,38,88,.6); color: var(--ink); font: 600 13px var(--font-body); cursor: pointer;
  transition: background .2s, border-color .2s, transform .2s var(--ease);
}
.chip:active { transform: scale(.95); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.chip[aria-pressed="true"] { background: rgba(217,178,95,.16); border-color: var(--gold); color: var(--gold-hi); }

.days { display: flex; flex-direction: column; gap: 12px; }
.day {
  display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px;
  animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms);
}
.date {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding-top: 10px; font-variant-numeric: tabular-nums;
}
.date b { font: 800 26px/1 var(--font-display); }
.date span { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.date.sun b { color: var(--gold-hi); }
.slots { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.slot {
  position: relative; overflow: hidden;
  display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  width: 100%; padding: 12px 14px 12px 0; border-radius: var(--r-md);
  background: rgba(14, 38, 88, .78); border: 1px solid var(--line-soft);
  color: var(--ink); font: inherit; text-align: left; cursor: pointer;
  transition: background .25s, border-color .25s, transform .2s var(--ease);
}
.slot:active { transform: scale(.985); }
.slot .stripe { align-self: stretch; margin-block: -12px; background: var(--c); opacity: .85; }
.slot .t { min-width: 0; }
.slot .t b { display: block; font-weight: 600; font-size: 15px; }
.slot .t small { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.slot .t small em { font-style: normal; color: var(--c); font-weight: 600; }
.check { width: 30px; height: 30px; flex: none; }
.check circle { fill: transparent; stroke: rgba(159,176,208,.4); stroke-width: 2; transition: fill .3s, stroke .3s; }
.check path { fill: none; stroke: var(--on-gold); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset .35s var(--ease) .08s; }
.slot[aria-pressed="true"] { background: linear-gradient(100deg, rgba(217,178,95,.2), rgba(14,38,88,.85) 70%); border-color: rgba(217,178,95,.55); }
.slot[aria-pressed="true"] .check circle { fill: var(--gold); stroke: var(--gold-hi); }
.slot[aria-pressed="true"] .check path { stroke-dashoffset: 0; }
.slot.pop .check { animation: pop .45s var(--ease); }
@keyframes pop { 40% { transform: scale(1.25); } }
.ripple { position: absolute; border-radius: 50%; pointer-events: none; background: rgba(247,226,166,.35); transform: scale(0); animation: ripple .6s ease-out forwards; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }

.note-card { padding: 16px; border-radius: var(--r-lg); background: rgba(14,38,88,.5); border: 1px dashed var(--line); display: flex; flex-direction: column; gap: 8px; }

.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--bg) 55%, rgba(6,20,48,0));
}
.dock .inner { max-width: 448px; margin: 0 auto; }
.badge { min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--on-gold); color: var(--gold-hi); font: 800 13px var(--font-display); font-variant-numeric: tabular-nums; }
.bump { animation: pop .4s var(--ease); }

/* ---------- Folha de envio ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: rgba(2, 8, 22, .7); backdrop-filter: blur(4px); animation: fade .3s both; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  position: relative; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
  background: linear-gradient(180deg, var(--surface), var(--bg-2));
  border: 1px solid var(--line); border-bottom: 0; border-radius: 26px 26px 0 0;
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 16px;
  animation: sheetUp .45s var(--ease) both;
}
@keyframes sheetUp { from { transform: translateY(100%); } }
.grabber { width: 44px; height: 5px; border-radius: 9px; background: rgba(159,176,208,.3); margin: 0 auto 4px; }
.sheet h3 { margin: 0; font: 700 22px/1.2 var(--font-display); text-wrap: balance; }
.sheet .sub { margin: -8px 0 0; color: var(--muted); font-size: 14px; }
.preview {
  margin: 0; padding: 14px; border-radius: var(--r-md); background: #0b1a3a; border: 1px solid var(--line-soft);
  font: 13px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #d7e0f3;
  white-space: pre-wrap; word-break: break-word; max-height: 34vh; overflow-y: auto;
}
.actions { display: flex; flex-direction: column; gap: 10px; }
.hint { font-size: 12.5px; color: var(--muted); text-align: center; margin: 0; }

.done { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 12px 0 4px; }
.done svg { width: 84px; height: 84px; }
.done circle { fill: none; stroke: var(--gold); stroke-width: 4; stroke-dasharray: 252; stroke-dashoffset: 252; animation: draw .8s var(--ease) forwards; }
.done path { fill: none; stroke: var(--gold-hi); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .5s var(--ease) .55s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.toast {
  position: fixed; left: 50%; top: calc(76px + env(safe-area-inset-top, 0px)); z-index: 60;
  transform: translate(-50%, -16px); opacity: 0; pointer-events: none;
  padding: 11px 18px; border-radius: 999px; background: var(--ink); color: var(--bg);
  font-weight: 600; font-size: 14px; box-shadow: 0 12px 30px rgba(0,0,0,.4);
  transition: opacity .3s, transform .3s var(--ease); max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
#confetti { position: fixed; inset: 0; z-index: 50; pointer-events: none; width: 100%; height: 100%; }

.foot { text-align: center; font-size: 12px; color: #6f82a8; letter-spacing: .08em; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
</style>

</head>
<body>
<div class="ambient" aria-hidden="true"><i></i><i></i></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e2a6"/><stop offset=".5" stop-color="#d9b25f"/><stop offset="1" stop-color="#a67c2e"/></linearGradient></defs>
</svg>
<main class="app" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
/* ===================== CONFIGURAÇÃO =====================
   Ajuste aqui sem mexer no resto do app. */
const CONFIG = {
  igreja: "ADVEC",
  // Número do WhatsApp de quem monta a escala, só dígitos com DDI e DDD (ex.: "5581999998888").
  // Vazio: o WhatsApp abre e o obreiro escolhe o contato ou grupo.
  whatsappLider: "",
  obreiros: [
    "Dc. Bezerra", "Dc. David", "Dc. Francisco", "Dc. Josival", "Dc. Maicon", "Dc. Victor",
    "Ob. Alex", "Ob. Augusto", "Ob. Edmilson", "Ob. Gerson", "Ob. Matheus", "Ob. Rofferson",
    "Ob. Samuel", "Ob. Wglas"

    else if (dow === 5 && d === ultimaSexta) tipos = ["sobrenatural"];
    if (tipos.length) dias.push({ d, dow, cultos: tipos.map(t => ({ id: `${ano}-${pad(mes + 1)}-${pad(d)}-${t}`, tipo: t, d, dow })) });
  }
  return dias;
}

/* ---------- estado ---------- */
const hoje = new Date();
const base = hoje.getDate() >= 15 ? new Date(hoje.getFullYear(), hoje.getMonth() + 1, 1) : new Date(hoje.getFullYear(), hoje.getMonth(), 1);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const state = {
  nome: store.get("advec:nome") || "",
  offset: 0, // meses a partir do mês-base (0..2)
  sel: new Set(),
  obs: "",
};
const mesAtual = () => { const m = new Date(base.getFullYear(), base.getMonth() + state.offset, 1); return { ano: m.getFullYear(), mes: m.getMonth() }; };
const chave = () => { const { ano, mes } = mesAtual(); return `advec:rascunho:${state.nome}:${ano}-${pad(mes + 1)}`; };
function carregarRascunho() {
  const r = store.get(chave()) || {};
  state.sel = new Set(r.sel || []);
  state.obs = r.obs || "";
}
function salvarRascunho() { store.set(chave(), { sel: [...state.sel], obs: state.obs }); }

/* ---------- helpers ---------- */
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {

    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);

  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(c));
  return el;
}
function svg(markup, cls) { const t = document.createElement("template"); t.innerHTML = markup.trim(); const s = t.content.firstChild; if (cls) s.setAttribute("class", cls); return s; }
const ICON = {

  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  wa: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3 2.4.9 2.9.8 3.4.7.5-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.8 9.8 0 0 1 12 2.2a9.8 9.8 0 0 1 0 19.6zM12 0a12 12 0 0 0-10.3 18l-1.7 6 6.2-1.6A12 12 0 1 0 12 0z"/></svg>',

const iniciais = n => n.replace(/^(Dc|Ob|Pr|Pb|Ev)\.?\s*/i, "").split(/\s+/).map(p => p[0] || "").join("").slice(0, 2).toUpperCase();
const cargo = n => /^dc\.?/i.test(n) ? "Diácono" : /^ob\.?/i.test(n) ? "Obreiro" : /^pb\.?/i.test(n) ? "Presbítero" : "";

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
function vibrar(ms = 12) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

const app = document.getElementById("app");

/* ===================== TELA 1: NOME ===================== */
function telaNome() {
  const { ano, mes } = mesAtual();
  let escolhido = state.nome;
  const outro = CONFIG.obreiros.includes(escolhido) ? "" : escolhido;
  const btn = h("button", { class: "btn btn-gold btn-block", id: "continuar", disabled: !escolhido, onclick: () => {
    const v = escolhido.trim();
    if (!v) return;
    state.nome = v; store.set("advec:nome", v); state.offset = 0; carregarRascunho(); telaCultos();
  } }, "Continuar", svg(ICON.right));

  const grid = h("div", { class: "names", role: "group", "aria-label": "Seu nome" },
    CONFIG.obreiros.map((n, i) => h("button", {
      class: "name", style: `--i:${i}`, "aria-pressed": String(n === escolhido),
      onclick: e => {
        escolhido = n; input.value = "";

        btn.disabled = false; vibrar();
      } },
      h("span", { class: "av" }, iniciais(n)),

    ))
  );
  const input = h("input", { class: "input", id: "outro-nome", placeholder: "Ex.: Ob. João", value: outro, autocomplete: "name",
    oninput: e => {
      escolhido = e.target.value;
      grid.querySelectorAll(".name").forEach(b => b.setAttribute("aria-pressed", "false"));
      btn.disabled = !escolhido.trim();
    } });

  app.replaceChildren(h("section", { class: "screen" },
    h("div", { class: "hero" },
      h("div", { class: "seal" }, h("img", { src: LOGO, alt: "Brasão da " + CONFIG.igreja })),
      h("div", { class: "eyebrow" }, CONFIG.igreja),
      h("h1", {}, "Escala de Obreiros"),
      h("p", { class: "lead" }, "Toque no seu nome e marque os cultos em que você pode servir em ", h("b", {}, `${MESES[mes]} de ${ano}`), ".")
    ),
    h("p", { class: "section-label" }, "Quem é você?"),
    grid,
    h("div", { class: "field" }, h("label", { for: "outro-nome" }, "Seu nome não está na lista? Digite aqui:"), input),
    btn,
    h("p", { class: "foot" }, "ASSEMBLEIA DE DEUS VITÓRIA EM CRISTO")

  document.getElementById("dock")?.remove();
  window.scrollTo({ top: 0 });
}

/* ===================== TELA 2: CULTOS ===================== */
let ui = {};
function telaCultos() {
  const { ano, mes } = mesAtual();
  const dias = cultosDoMes(ano, mes);
  const todos = dias.flatMap(d => d.cultos);
  ui = { todos, slots: new Map(), chips: new Map() };

  const C = 2 * Math.PI * 38;
  const ring = h("div", { class: "ring" });
  ring.innerHTML = `<svg viewBox="0 0 84 84"><circle class="track" cx="42" cy="42" r="38"/><circle class="bar" cx="42" cy="42" r="38" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>`;
  const val = h("div", { class: "val" }, h("div", {}, h("b", { id: "count" }, "0"), h("span", {}, `de ${todos.length}`)));
  ring.append(val);
  ui.ringBar = ring.querySelector(".bar"); ui.C = C;

  const prev = h("button", { class: "icon-btn", "aria-label": "Mês anterior", disabled: state.offset <= 0, onclick: () => trocarMes(-1) }, svg(ICON.left));
  const next = h("button", { class: "icon-btn", "aria-label": "Próximo mês", disabled: state.offset >= 2, onclick: () => trocarMes(1) }, svg(ICON.right));
  ui.statusTxt = h("p", {});

  const tiposDoMes = [...new Set(todos.map(c => c.tipo))];
  const ordem = ["palavra", "vitoria", "edp", "cel1", "cel2", "sobrenatural"];
  const quick = h("div", { class: "quick", role: "group", "aria-label": "Marcar vários de uma vez" },
    ordem.filter(t => tiposDoMes.includes(t)).map(t => {
      const b = h("button", { class: "chip", style: `--c:${TIPOS[t].cor}`, "aria-pressed": "false", onclick: () => marcarTipo(t) }, h("i"), TIPOS[t].chip);
      ui.chips.set(t, b); return b;
    }),
    (() => { const b = h("button", { class: "chip", style: "--c:#ffffff", "aria-pressed": "false", onclick: marcarTodos }, h("i"), "Todos"); ui.chips.set("*", b); return b; })()
  );

  const lista = h("div", { class: "days" }, dias.map((dia, i) =>
    h("div", { class: "day", style: `--i:${Math.min(i, 14)}` },
      h("div", { class: "date" + (dia.dow === 0 ? " sun" : ""), "aria-hidden": "true" }, h("b", {}, pad(dia.d)), h("span", {}, DOW[dia.dow])),
      h("div", { class: "slots" }, dia.cultos.map(c => {
        const t = TIPOS[c.tipo];
        const b = h("button", { class: "slot", style: `--c:${t.cor}`, "aria-pressed": String(state.sel.has(c.id)),
            "aria-label": `${DOW_LONG[c.dow]}, ${c.d} de ${MESES[mes]}: ${t.nome}${t.hora ? " às " + t.hora : ""}`,
            onclick: e => alternar(c.id, e) },
          h("span", { class: "stripe" }),
          h("span", { class: "t" }, h("b", {}, t.nome), h("small", {}, t.hora ? h("em", {}, t.hora) : null, `${DOW_LONG[c.dow]}, ${c.d}/${pad(mes + 1)}`)),
          svg(ICON.check, "check"));
        ui.slots.set(c.id, b); return b;
      }))
    )
  ));

  const obs = h("textarea", { class: "input", id: "obs", rows: "2", placeholder: "Ex.: Posso chegar só às 19h na quarta." , oninput: e => { state.obs = e.target.value; salvarRascunho(); } });
  obs.value = state.obs;

  app.replaceChildren(h("section", { class: "screen" },
    h("header", { class: "topbar" },
      h("img", { src: LOGO, alt: "" }),
      h("div", { class: "who" }, h("div", { class: "hi" }, "A paz do Senhor,"), h("div", { class: "nm" }, state.nome)),
      h("button", { class: "link-btn", onclick: telaNome }, "Trocar")
    ),
    h("div", { class: "summary" }, ring,
      h("div", {},
        h("div", { class: "month" }, h("h2", {}, MESES[mes] + " ", h("span", {}, String(ano))), h("div", { class: "arrows" }, prev, next)),
        ui.statusTxt)),
    h("div", { style: "display:flex;flex-direction:column;gap:10px" }, h("p", { class: "section-label" }, "Marcar de uma vez"), quick),
    h("p", { class: "section-label" }, "Toque nos cultos em que você pode servir"),
    lista,
    h("div", { class: "note-card" }, h("label", { for: "obs", class: "section-label" }, "Observação (opcional)"), obs)
  ));

  ui.badge = h("span", { class: "badge" }, "0");
  ui.sendBtn = h("button", { class: "btn btn-gold btn-block", onclick: abrirEnvio }, svg(ICON.send), "Enviar disponibilidade", ui.badge);
  document.body.append(h("div", { class: "dock", id: "dock" }, h("div", { class: "inner" }, ui.sendBtn)));
  atualizar(false);
  window.scrollTo({ top: 0 });
}

function trocarMes(delta) {
  salvarRascunho();
  state.offset = Math.max(0, Math.min(2, state.offset + delta));
  carregarRascunho(); telaCultos();
}

function alternar(id, e) {
  const on = !state.sel.has(id);
  on ? state.sel.add(id) : state.sel.delete(id);
  const b = ui.slots.get(id);
  b.setAttribute("aria-pressed", String(on));
  if (e && on) {
    const r = b.getBoundingClientRect(), size = Math.max(r.width, r.height) * 2.2;
    const x = (e.clientX || r.left + r.width / 2) - r.left - size / 2, y = (e.clientY || r.top + r.height / 2) - r.top - size / 2;
    const rp = h("span", { class: "ripple", style: `width:${size}px;height:${size}px;left:${x}px;top:${y}px` });
    b.append(rp); setTimeout(() => rp.remove(), 650);
  }
  b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
  vibrar(on ? 14 : 6);
  salvarRascunho(); atualizar(true);
}
function marcarTipo(t) {
  const ids = ui.todos.filter(c => c.tipo === t).map(c => c.id);
  const all = ids.every(id => state.sel.has(id));
  ids.forEach(id => all ? state.sel.delete(id) : state.sel.add(id));
  aplicarSlots(ids); vibrar(18); salvarRascunho(); atualizar(true);
  toast(all ? "Desmarcados: " + TIPOS[t].chip : "Marcados: " + TIPOS[t].chip);
}
function marcarTodos() {
  const ids = ui.todos.map(c => c.id);
  const all = ids.every(id => state.sel.has(id));
  ids.forEach(id => all ? state.sel.delete(id) : state.sel.add(id));
  aplicarSlots(ids); vibrar(18); salvarRascunho(); atualizar(true);
  toast(all ? "Todos os cultos desmarcados" : "Todos os cultos marcados");
}
function aplicarSlots(ids) {
  ids.forEach((id, i) => {
    const b = ui.slots.get(id); const on = state.sel.has(id);
    if (b.getAttribute("aria-pressed") !== String(on)) {
      setTimeout(() => { b.setAttribute("aria-pressed", String(on)); b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); }, Math.min(i, 20) * 30);
    }
  });
}
function atualizar(animar) {
  const n = ui.todos.filter(c => state.sel.has(c.id)).length, total = ui.todos.length;
  document.getElementById("count").textContent = n;
  ui.badge.textContent = n;
  if (animar) { ui.badge.classList.remove("bump"); void ui.badge.offsetWidth; ui.badge.classList.add("bump"); }
  ui.ringBar.style.strokeDashoffset = ui.C * (1 - (total ? n / total : 0));
  ui.statusTxt.textContent = n === 0 ? "Nenhum culto marcado ainda." : n === total ? "Disponível em todos os cultos. Glória a Deus!" : `Você marcou ${n} ${n === 1 ? "culto" : "cultos"}.`;
  for (const [t, b] of ui.chips) {
    const ids = t === "*" ? ui.todos : ui.todos.filter(c => c.tipo === t);
    b.setAttribute("aria-pressed", String(ids.length > 0 && ids.every(c => state.sel.has(c.id))));
  }
}

/* ===================== ENVIO ===================== */
function montarMensagem() {
  const { ano, mes } = mesAtual();
  const escolhidos = ui.todos.filter(c => state.sel.has(c.id));
  const linhas = [`*ESCALA DE OBREIROS · ${CONFIG.igreja}*`, `*${MESES[mes].toUpperCase()} DE ${ano}*`, "", `👤 *${state.nome}*`];
  if (!escolhidos.length) {
    linhas.push("", "❌ Não estarei disponível neste mês.");
  } else {
    linhas.push(`✅ Disponível em ${escolhidos.length} de ${ui.todos.length} cultos:`);
    let diaAtual = 0;
    for (const c of escolhidos) {
      if (c.d !== diaAtual) { diaAtual = c.d; linhas.push("", `*${DOW[c.dow]} ${pad(c.d)}/${pad(mes + 1)}*`); }
      const t = TIPOS[c.tipo];
      linhas.push(`• ${t.nome}${t.hora ? " – " + t.hora : ""}`);
    }
  }
  if (state.obs.trim()) linhas.push("", `📝 Obs.: ${state.obs.trim()}`);
  return linhas.join("\n");
}
function linkWhats(msg) {
  const num = String(CONFIG.whatsappLider || "").replace(/\D/g, "");
  return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
}
function abrirEnvio() {
  const n = ui.todos.filter(c => state.sel.has(c.id)).length;
  const msg = montarMensagem();
  const pre = h("pre", { class: "preview", id: "preview", tabindex: "0" }, msg);
  const fechar = () => { wrap.remove(); document.removeEventListener("keydown", esc); };
  const esc = e => { if (e.key === "Escape") fechar(); };
  document.addEventListener("keydown", esc);

  const wa = h("a", { class: "btn btn-wa btn-block", href: linkWhats(msg), target: "_blank", rel: "noopener",
    onclick: () => { setTimeout(() => concluir(sheet), 250); } }, svg(ICON.wa), "Enviar pelo WhatsApp");
  const copiar = h("button", { class: "btn btn-ghost btn-block", onclick: async () => {
    try { await navigator.clipboard.writeText(msg); toast("Mensagem copiada. Cole no WhatsApp do líder."); }
    catch (e) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texto selecionado. Toque em Copiar."); }
  } }, svg(ICON.copy), "Copiar mensagem");

  const sheet = h("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-labelledby": "sheet-title" },
    h("div", { class: "grabber" }),
    h("h3", { id: "sheet-title" }, n ? `Confira sua disponibilidade` : "Você não marcou nenhum culto"),
    h("p", { class: "sub" }, n ? `${n} ${n === 1 ? "culto marcado" : "cultos marcados"}. Esta é a mensagem que vai para quem monta a escala:` : "Se não puder servir neste mês, envie assim mesmo para o líder saber."),
    pre,
    h("div", { class: "actions" }, wa, copiar, h("button", { class: "btn btn-ghost btn-block", onclick: fechar }, "Voltar e editar")),
    h("p", { class: "hint" }, "O WhatsApp abre com a mensagem pronta. É só tocar em enviar.")
  );
  const wrap = h("div", { class: "sheet-wrap" }, h("div", { class: "scrim", onclick: fechar }), sheet);
  document.body.append(wrap);
  wa.focus({ preventScroll: true });
}
function concluir(sheet) {
  const { ano, mes } = mesAtual();
  store.set(chave() + ":enviado", Date.now());
  sheet.replaceChildren(
    h("div", { class: "grabber" }),
    h("div", { class: "done" },
      svg('<svg viewBox="0 0 90 90"><circle cx="45" cy="45" r="40"/><path d="M28 46l12 12 23-25"/></svg>'),
      h("h3", {}, "Mensagem pronta!"),
      h("p", { class: "sub", style: "margin:0" }, `Confirme o envio no WhatsApp. Obrigado por servir na casa do Senhor em ${MESES[mes]}.`)
    ),
    h("button", { class: "btn btn-gold btn-block", onclick: () => sheet.parentElement.remove() }, "Fechar")
  );
  confete();
}

/* ---------- confete dourado ---------- */
function confete() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cores = ["#f7e2a6", "#d9b25f", "#a67c2e", "#ffffff", "#7fb2ff"];
  const ps = Array.from({ length: 120 }, () => ({
    x: innerWidth / 2, y: innerHeight * 0.45,
    vx: (Math.random() - .5) * 12, vy: -Math.random() * 13 - 4,
    r: Math.random() * 5 + 3, a: Math.random() * Math.PI, va: (Math.random() - .5) * .3,
    c: cores[(Math.random() * cores.length) | 0], f: Math.random() < .5
  }));
  let t = 0;
  (function frame() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) {
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - t / 140);
      p.f ? ctx.fillRect(-p.r, -p.r / 3, p.r * 2, p.r / 1.5) : (ctx.beginPath(), ctx.arc(0, 0, p.r / 2, 0, 7), ctx.fill());
      ctx.restore();
    }
    if (++t < 140) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

/* ---------- início ---------- */
if (state.nome) { carregarRascunho(); telaCultos(); } else telaNome();
